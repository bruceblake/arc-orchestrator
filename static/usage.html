<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARC · Usage</title>
<style>
:root {
  --bg: #0d1117; --panel: #161b22; --border: #30363d; --text: #c9d1d9;
  --dim: #8b949e; --accent: #58a6ff; --ok: #3fb950; --warn: #d29922;
  --err: #f85149; --purple: #bc8cff;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; }
body { min-height: 100vh; }
.nav { display: flex; flex-basis: 100%; gap: 14px; align-items: center; padding: 2px 0 8px; }
.nav a { color: var(--dim); text-decoration: none; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; letter-spacing: .3px; white-space: nowrap; }
.nav a:hover { color: var(--accent); }
.nav a.on { color: var(--accent); text-decoration: underline; pointer-events: none; cursor: default; }
main { padding: 12px 14px; max-width: 1400px; margin: 0 auto; }

/* sticky top toolbar */
.toolbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 10px 14px; border-bottom: 1px solid var(--border); background: var(--bg); }
.toolbar h1 { font-size: 15px; margin: 0; color: var(--accent); white-space: nowrap; }
.spacer { flex: 1; }
.seg { padding: 8px 14px; min-height: 36px; border: 1px solid var(--border); background: none; color: var(--dim);
  border-radius: 12px; font: inherit; font-size: 13px; cursor: pointer; white-space: nowrap; }
.seg:hover { border-color: var(--accent); color: var(--accent); }
.seg.on { border-color: var(--accent); color: var(--accent); background: #161b22; }
.stat { color: var(--dim); font-size: 12px; white-space: nowrap; }
.stat b { color: var(--text); font-weight: normal; }
.badge { display: inline-block; padding: 2px 8px; min-height: 36px; line-height: 30px; border-radius: 12px;
  border: 1px solid var(--warn); color: var(--warn); font-size: 11px; white-space: nowrap; }

/* panels */
.panel { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 12px; margin-bottom: 14px; }
.panel h2 { font-size: 12px; margin: 0 0 10px; color: var(--dim); text-transform: uppercase; letter-spacing: .4px; }
h2 .hl { color: var(--accent); }

/* grand-total banner */
.totrow { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.big { font-size: 28px; color: var(--accent); }
.big small { font-size: 12px; color: var(--dim); }
.tot-kv { color: var(--dim); font-size: 12px; }
.tot-kv b { color: var(--text); font-weight: normal; }
.tot-kv .ok { color: var(--ok); } .tot-kv .err { color: var(--err); }
.splitbar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: #21262d; margin: 10px 0 2px; }
.splitbar i { display: block; height: 100%; }
.splitbar .p { background: var(--accent); } .splitbar .c { background: var(--purple); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; color: var(--dim); font-size: 11px; margin-top: 4px; }
.legend .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; }

/* model cards */
.modelgrid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
.mcard { border: 1px solid var(--border); border-radius: 8px; background: #0d1117; padding: 10px 12px; }
.mcard .mhead { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 6px; }
.mcard .mname { font-size: 14px; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; }
.tag { display: inline-block; padding: 0 6px; border-radius: 8px; background: #21262d; color: var(--dim); font-size: 11px; white-space: nowrap; }
.mtok { font-size: 22px; color: var(--text); }
.mtok small { font-size: 12px; color: var(--dim); }
.mrow { color: var(--dim); font-size: 12px; margin: 2px 0; }
.mrow b { color: var(--text); font-weight: normal; }
.mrow .ok { color: var(--ok); } .mrow .err { color: var(--err); }
.sharebar { display: block; height: 6px; border-radius: 3px; background: #21262d; overflow: hidden; margin: 8px 0 3px; }
.sharebar i { display: block; height: 100%; }
.mcap { color: var(--dim); font-size: 11px; }

/* family table */
table { border-collapse: collapse; width: 100%; }
th, td { padding: 6px 8px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: top; white-space: nowrap; }
th { color: var(--dim); font-weight: normal; font-size: 11px; }
td { font-size: 12px; }
.r { text-align: right; }

.empty { color: var(--dim); font-size: 12px; padding: 10px 0; }

@media (max-width: 640px) {
  .toolbar { padding: 8px 10px; gap: 6px; }
  .seg { padding: 8px 10px; font-size: 12px; }
  main { padding: 10px; }
  .modelgrid { grid-template-columns: 1fr; }
  .tot-kv { display: block; }
}
</style>
</head>
<body>
<header class="toolbar">
  <nav class="nav">
    <a href="/">Projects</a>
    <a class="on" href="/usage.html">Usage</a>
    <a href="/phone.html">Phone</a>
  </nav>
  <h1>ARC · Usage</h1>
  <div id="ranges" style="display:flex;gap:4px">
    <button class="seg" data-r="1h">1h</button>
    <button class="seg" data-r="24h">24h</button>
    <button class="seg" data-r="7d">7d</button>
    <button class="seg" data-r="all">all</button>
  </div>
  <span class="spacer"></span>
  <span class="stat" id="alltime-stat" title="all-history tokens (incl. prompt/completion)">all-time <b id="alltime">—</b></span>
  <span class="stat">refresh <b id="count">5s</b></span>
  <span class="stat">updated <b id="clock">—</b></span>
  <span class="badge" id="stale" style="display:none">stale (retrying)</span>
</header>
<main>
  <section class="panel">
    <h2>total · <span class="hl" id="range-label">1h</span></h2>
    <div class="totrow">
      <span class="big"><b id="total-tok">—</b> <small>tokens</small></span>
      <span class="tot-kv">requests <b id="total-req">—</b></span>
      <span class="tot-kv">ok <b class="ok" id="total-ok">—</b></span>
      <span class="tot-kv">errors <b class="err" id="total-err">—</b></span>
    </div>
    <div class="splitbar"><i class="p" id="split-prompt" style="width:0%"></i><i class="c" id="split-comp" style="width:0%"></i></div>
    <div class="legend">
      <span><span class="dot" style="background:var(--accent)"></span>prompt <b class="hl" id="total-pr">—</b></span>
      <span><span class="dot" style="background:var(--purple)"></span>completion <b class="hl" id="total-co">—</b></span>
    </div>
  </section>

  <section class="panel">
    <h2>Models</h2>
    <div class="modelgrid" id="modelgrid"></div>
    <div class="empty" id="models-empty" style="display:none">No model activity in this range.</div>
  </section>

  <section class="panel">
    <h2>Families</h2>
    <table>
      <thead><tr><th>family</th><th class="r">cap</th><th class="r">requests</th><th class="r">tokens</th><th class="r">inflight</th></tr></thead>
      <tbody id="fam-body"></tbody>
    </table>
  </section>
</main>

<script>
"use strict";
const $ = s => document.querySelector(s);
const RANGES = ["1h", "24h", "7d", "all"];
const AUTO = 5000;
const COLORS = {"gpt-oss":"#3fb950","glm":"#58a6ff","kimi":"#bc8cff","deepseek":"#d29922","kimi-code":"#8b949e","harness":"#e3b341","unknown":"#484f58"};
const SRC = {"arc-pool":"pool","kimi-code":"kimi-code"};
let RANGE = "1h", USAGE = null, FLEET = {caps:{}, totals:null}, nextAt = Date.now() + AUTO;

const fmt = n => n == null || isNaN(n) ? "—" : n >= 1e6 ? (n/1e6).toFixed(2)+"M" : n >= 1e3 ? (n/1e3).toFixed(1)+"k" : String(n);
const ms = n => n == null ? "—" : n >= 1000 ? (n/1000).toFixed(1)+"s" : Math.round(n)+"ms";
const ago = ts => { if (!ts) return "—"; const s = Math.max(0, (Date.now()/1000) - ts);
  if (s < 60) return Math.round(s)+"s ago"; if (s < 3600) return Math.round(s/60)+"m ago";
  if (s < 86400) return (s/3600).toFixed(1)+"h ago"; return (s/86400).toFixed(1)+"d ago"; };
const esc = s => String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const srcLabel = s => SRC[s] || (s && s.startsWith("driver:") ? "driver:" + s.split(":")[1] : (s || ""));

async function jget(url) {
  const r = await fetch(url, {cache:"no-store"});
  if (!r.ok) return null;
  return r.json();
}

function capLookup(f) {
  const caps = {};
  const arr = f && (Array.isArray(f.models) ? f.models : (Array.isArray(f.by_model) ? f.by_model : []));
  for (const m of arr) if (m && m.model) caps[m.model] = m;
  return caps;
}

async function fetchFleet() {
  try {
    const f = await jget("/api/fleet");
    if (f && f.totals) return {caps: capLookup(f), totals: f.totals, fromUsage:false};
  } catch (e) {}
  try {
    const u = await jget("/api/usage?range=all");
    return {caps: {}, totals: u ? u.totals : null, fromUsage:true};
  } catch (e) {}
  return {caps: {}, totals: null, fromUsage:false};
}

function fillToolbar(fleet) {
  $("#alltime").textContent = fleet.totals && fleet.totals.tokens != null ? fmt(fleet.totals.tokens) : "—";
  $("#alltime-stat").title = "all-history tokens" + (fleet.totals && fleet.totals.prompt_tokens != null
    ? " · " + fmt(fleet.totals.prompt_tokens) + " prompt / " + fmt(fleet.totals.completion_tokens) + " completion" : "");
}

function fillTotal(u) {
  const t = u.totals || {};
  $("#total-tok").textContent = fmt(t.tokens);
  $("#total-req").textContent = t.requests;
  $("#total-ok").textContent = t.ok;
  $("#total-err").textContent = t.errors;
  const p = t.prompt_tokens || 0, c = t.completion_tokens || 0, tot = p + c;
  const pp = tot ? (p/tot)*100 : 0;
  $("#split-prompt").style.width = pp + "%";
  $("#split-comp").style.width = (tot ? 100 - pp : 0) + "%";
  $("#total-pr").textContent = fmt(p);
  $("#total-co").textContent = fmt(c);
  $("#range-label").textContent = (u.range || RANGE).toUpperCase();
}

function mkey(m) { return (m.model||"") + "|" + (m.source||""); }

function fillCard(card, m, caps, totalTok) {
  const c = COLORS[m.family] || COLORS.unknown;
  card.querySelector(".dot").style.background = c;
  card.querySelector(".mname").textContent = m.pretty || m.model;
  card.querySelector(".v-src").textContent = srcLabel(m.source);
  card.querySelector(".fam-tag").textContent = m.family || "?";
  card.querySelector(".v-tok").textContent = fmt(m.tokens);
  card.querySelector(".v-req").textContent = fmt(m.requests);
  card.querySelector(".v-ok").textContent = fmt(m.ok);
  card.querySelector(".v-err").textContent = fmt(m.errors);
  card.querySelector(".v-lat").textContent = ms(m.avg_latency_ms);
  card.querySelector(".v-last").textContent = ago(m.last_ts);
  const share = totalTok && m.tokens ? (m.tokens/totalTok)*100 : 0;
  card.querySelector(".v-share").style.width = Math.min(100, share) + "%";
  card.querySelector(".v-sharepct").textContent = totalTok && m.tokens ? share.toFixed(1) + "%" : "0%";
  const cap = caps && caps[m.model];
  const capEl = card.querySelector(".v-caps");
  if (cap && (cap.account_cap != null || cap.driver_cap != null)) {
    const a = cap.account_cap != null ? "a " + cap.account_cap : "";
    const d = cap.driver_cap != null ? "d " + cap.driver_cap : "";
    capEl.textContent = " · cap " + [a, d].filter(Boolean).join(" / ");
  } else {
    capEl.textContent = "";
  }
}

function buildCard(m, caps, totalTok) {
  const card = document.createElement("div");
  card.className = "mcard";
  card.dataset.mk = mkey(m);
  card.innerHTML =
    '<div class="mhead"><span class="dot"></span><b class="mname"></b>'
    + '<span class="tag fam-tag"></span><span class="tag v-src"></span></div>'
    + '<div class="mtok"><b class="v-tok">—</b> <small>tok</small></div>'
    + '<div class="mrow">req <b class="v-req">—</b> · ok <b class="ok v-ok">—</b> · err <b class="err v-err">—</b></div>'
    + '<div class="mrow">lat <b class="v-lat">—</b> · last <b class="v-last">—</b></div>'
    + '<div class="sharebar"><i class="v-share" style="width:0%"></i></div>'
    + '<div class="mcap">share <b class="v-sharepct">0%</b><span class="v-caps"></span></div>';
  fillCard(card, m, caps, totalTok);
  return card;
}

function updateModels(models, caps, totalTok) {
  const grid = $("#modelgrid");
  const seen = new Set();
  for (const m of (models || [])) {
    const k = mkey(m);
    seen.add(k);
    let card = grid.querySelector('[data-mk="' + k.replace(/"/g, '\\"') + '"]');
    if (!card) { card = buildCard(m, caps, totalTok); grid.appendChild(card); }
    else fillCard(card, m, caps, totalTok);
  }
  grid.querySelectorAll(".mcard").forEach(c => { c.style.display = seen.has(c.dataset.mk) ? "" : "none"; });
  $("#models-empty").style.display = (models || []).length ? "none" : "";
}

function familyRow(f) {
  const tr = document.createElement("tr");
  tr.dataset.fam = f.family;
  tr.innerHTML = '<td><span class="dot"></span><span class="f-name"></span></td>'
    + '<td class="r f-cap"></td><td class="r f-req"></td><td class="r f-tok"></td><td class="r f-in"></td>';
  return tr;
}

function updateFamilies(families) {
  const tb = $("#fam-body");
  const seen = new Set();
  for (const f of (families || [])) {
    seen.add(f.family);
    let tr = tb.querySelector('[data-fam="' + f.family.replace(/"/g, '\\"') + '"]');
    if (!tr) { tr = familyRow(f); tb.appendChild(tr); }
    const c = COLORS[f.family] || COLORS.unknown;
    tr.querySelector(".dot").style.background = c;
    tr.querySelector(".f-name").textContent = f.family;
    tr.querySelector(".f-cap").textContent = f.limit != null ? f.limit : "—";
    tr.querySelector(".f-req").textContent = fmt(f.requests);
    tr.querySelector(".f-tok").textContent = fmt(f.tokens);
    tr.querySelector(".f-in").textContent = f.inflight;
  }
  tb.querySelectorAll("tr[data-fam]").forEach(tr => {
    if (!seen.has(tr.dataset.fam)) tr.style.display = "none";
    else tr.style.display = "";
  });
  let empty = tb.querySelector("tr.f-empty");
  if (!(families || []).length) {
    if (!empty) { empty = document.createElement("tr"); empty.className = "f-empty";
      empty.innerHTML = '<td colspan="5" class="empty">none</td>'; tb.appendChild(empty); }
  } else if (empty) { empty.remove(); }
}

function updateUI(u, fleet) {
  USAGE = u; FLEET = fleet;
  fillTotal(u);
  fillToolbar(fleet);
  updateModels(u.models, fleet.caps, u.totals.tokens);
  updateFamilies(u.families);
}

async function load() {
  try {
    const u = await jget("/api/usage?range=" + RANGE);
    if (!u) throw new Error("usage unavailable");
    const fleet = await fetchFleet();
    updateUI(u, fleet);
    $("#stale").style.display = "none";
    $("#clock").textContent = new Date().toLocaleTimeString();
  } catch (e) {
    $("#stale").style.display = "";
  }
}

function applyRange(r) {
  if (!RANGES.includes(r)) r = "1h";
  RANGE = r;
  location.hash = r;
  document.querySelectorAll("#ranges .seg").forEach(b => b.classList.toggle("on", b.dataset.r === r));
  load();
}

document.querySelectorAll("#ranges .seg").forEach(b => b.onclick = () => applyRange(b.dataset.r));
window.addEventListener("hashchange", () => applyRange(location.hash.replace("#", "")));

function refresh() {
  load().finally(() => { nextAt = Date.now() + AUTO; });
}
setInterval(() => {
  const left = Math.max(0, Math.ceil((nextAt - Date.now()) / 1000));
  $("#count").textContent = left + "s";
  if (Date.now() >= nextAt) refresh();
}, 1000);
window.addEventListener("resize", () => { if (USAGE) updateUI(USAGE, FLEET); });

const initRange = location.hash.replace("#", "");
RANGE = RANGES.includes(initRange) ? initRange : "1h";
document.querySelectorAll("#ranges .seg").forEach(b => b.classList.toggle("on", b.dataset.r === RANGE));
load();
</script>
</body>
</html>
