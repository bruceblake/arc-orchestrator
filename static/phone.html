<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ARC Phone</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root {
  --bg: #0d1117; --panel: #161b22; --border: #30363d; --text: #c9d1d9;
  --dim: #8b949e; --accent: #58a6ff; --ok: #3fb950; --warn: #d29922;
  --err: #f85149; --purple: #bc8cff; --grey: #484f58;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 12.5px/1.4 "SF Mono", "Cascadia Code", Consolas, ui-monospace, monospace;
}
.strip {
  position: sticky; top: 0; z-index: 10; background: var(--bg);
  border-bottom: 1px solid var(--border); max-width: 720px; margin: 0 auto;
  padding: 7px 10px; display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center;
}
.nav { display: flex; flex-basis: 100%; gap: 14px; align-items: center; padding: 2px 0 8px; }
.nav a { color: var(--dim); text-decoration: none; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; letter-spacing: .3px; white-space: nowrap; }
.nav a:hover { color: var(--accent); }
.nav a.on { color: var(--accent); text-decoration: underline; pointer-events: none; cursor: default; }
.strip .s-group { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
.strip .s-label { font-size: 9.5px; color: var(--dim); text-transform: uppercase; letter-spacing: .04em; }
.strip b { font-weight: 700; font-size: 13px; }
.strip b.g { color: var(--ok); } .strip b.b { color: var(--err); } .strip b.w { color: var(--warn); }
.chip {
  display: inline-block; font-size: 10px; padding: 0 6px; border-radius: 7px;
  border: 1px solid; line-height: 16px; margin: 0 2px;
}
#s-stale {
  font-size: 10px; color: var(--err); border: 1px solid var(--err);
  border-radius: 7px; padding: 0 6px; line-height: 16px;
}
main { padding: 8px; display: grid; gap: 8px; max-width: 720px; margin: 0 auto; }
.panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
.panel h2 {
  font-size: 10px; margin: 0; padding: 8px 12px; color: var(--dim);
  text-transform: uppercase; letter-spacing: .06em; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 6px;
}
.panel h2 .cnt { margin-left: auto; color: var(--text); }
.empty { color: var(--dim); font-size: 11.5px; padding: 10px 12px; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; flex: 0 0 8px; }
@keyframes pulse { 50% { opacity: .3; } }

.agent { border-bottom: 1px solid var(--border); }
.agent:last-child { border-bottom: none; }
.a-head {
  display: flex; align-items: center; gap: 6px; padding: 9px 10px;
  min-height: 38px; cursor: pointer; -webkit-tap-highlight-color: transparent;
}
.a-head:hover { background: #1c2128; }
.a-head .m { font-weight: 700; font-size: 12px; flex: 0 0 auto; }
.a-head .role { color: var(--dim); font-size: 10.5px; flex: 0 0 auto; }
.a-head .task { color: var(--accent); font-size: 11px; overflow: hidden; text-overflow: ellipsis; flex: 1 1 auto; min-width: 0; }
.a-head .att { color: var(--warn); font-size: 10.5px; flex: 0 0 auto; }
.a-head .elp { color: var(--dim); font-size: 11px; flex: 0 0 auto; }
.a-head .chev { color: var(--dim); font-size: 11px; flex: 0 0 auto; }
.a-tx { background: #0d1117; border-top: 1px solid var(--border); }
.a-tx .tx-meta { font-size: 10px; color: var(--dim); padding: 5px 10px 0; }
.a-tx .tx-body {
  margin: 0; padding: 6px 10px 10px; font-size: 10.5px; white-space: pre-wrap;
  word-break: break-all; max-height: 220px; overflow: auto; color: var(--text);
}

.task {
  display: flex; align-items: center; gap: 7px; padding: 8px 10px;
  min-height: 36px; border-bottom: 1px solid var(--border);
}
.task:last-child { border-bottom: none; }
.task .tname { font-size: 11.5px; color: var(--accent); overflow: hidden; text-overflow: ellipsis; flex: 1 1 auto; min-width: 0; }
.task .tmodel { font-size: 10px; flex: 0 0 auto; }
.task .tstate { font-size: 9.5px; text-transform: uppercase; flex: 0 0 auto; }
.foot { color: var(--dim); font-size: 10px; text-align: center; padding: 6px; }
.foot a { color: var(--accent); text-decoration: none; }
</style>
</head>
<body>
<header class="strip">
  <nav class="nav">
    <a href="/">Projects</a>
    <a href="/usage.html">Usage</a>
    <a class="on" href="/phone.html">Phone</a>
  </nav>
  <div class="s-group"><span class="s-label">agents</span><b id="s-agents">0</b></div>
  <span id="s-chips"></span>
  <div class="s-group"><span class="s-label">tok/1h</span><b id="s-tok">–</b></div>
  <span id="s-fleet" hidden></span>
  <div class="s-group"><span class="s-label">merged</span><b id="s-merged" class="g">0</b></div>
  <div class="s-group"><span class="s-label">failed</span><b id="s-failed" class="b">0</b></div>
  <span id="s-stale" hidden>stale</span>
</header>
<main>
  <section class="panel">
    <h2>Agents running now <span class="cnt" id="ag-cnt"></span></h2>
    <div id="agents"><div class="empty">loading…</div></div>
  </section>
  <section class="panel">
    <h2>Tasks <span class="cnt" id="task-cnt"></span></h2>
    <div id="tasks"><div class="empty">loading…</div></div>
  </section>
  <div class="foot">auto-refresh 5s · <a href="/">flows</a> · <a href="/usage.html">usage</a></div>
</main>

<script src="/common.js"></script>
<script>
"use strict";
const $ = s => document.getElementById(s);
function familyOf(model) {
  const m = String(model || '').toLowerCase();
  if (m.includes('kimi')) return 'kimi';
  if (m.includes('glm')) return 'glm';
  if (m.includes('gpt-oss')) return 'gpt-oss';
  if (m.includes('deepseek')) return 'deepseek';
  return 'harness';
}
const colorOf = a => COLORS[a.family] || COLORS[familyOf(a.model)] || COLORS.harness;
const baseOf = t => (t || '').replace(/-x\d+$/, '');
const attOf = t => { const m = (t || '').match(/-x(\d+)$/); return m ? +m[1] : null; };

const state = {agents: [], projects: [], tok1h: 0, fleet: null, fleetTried: false,
               expanded: null, tx: {}, txScroll: {}, stale: false};
const akey = a => a.req_id || (a.model + '|' + a.role + '|' + a.task);
const agentByKey = k => state.agents.find(a => akey(a) === k);

async function j(url) {
  const r = await fetch(url, {cache: 'no-store'});
  if (!r.ok) throw new Error(r.status);
  return r.json();
}

function allNodes() {
  const out = [];
  for (const p of state.projects)
    for (const n of ((p.dag && p.dag.nodes) || []))
      out.push({id: n.id, title: n.title || n.id, model: n.model, status: n.status, live: !!n.live});
  return out;
}
function rank(n) {
  if (n.status === 'running' || n.live) return 0;
  if (n.status === 'pending') return 1;
  if (n.status === 'conflict') return 2;
  if (n.status === 'failed') return 3;
  return 4;
}

function agentChips() {
  const seen = {};
  for (const a of state.agents) { const m = short(a.pretty || a.model); if (!seen[m]) seen[m] = colorOf(a); }
  return Object.entries(seen).map(([m, c]) => `<span class="chip" style="color:${c};border-color:${c}">${esc(m)}</span>`).join('');
}

function renderStrip() {
  $('s-agents').textContent = state.agents.length;
  $('s-chips').innerHTML = agentChips();
  $('s-tok').textContent = fmt(state.tok1h);
  let merged = 0, failed = 0;
  for (const n of allNodes()) {
    if (n.status === 'merged') merged++;
    else if (n.status === 'failed' || n.status === 'conflict') failed++;
  }
  $('s-merged').textContent = merged;
  $('s-failed').textContent = failed;
  const fl = $('s-fleet');
  if (state.fleet && state.fleet.totals && state.fleet.totals.tokens != null) {
    fl.hidden = false;
    fl.innerHTML = `<div class="s-group"><span class="s-label">alltime</span><b>${fmt(state.fleet.totals.tokens)}</b></div>`;
  } else fl.hidden = true;
  $('s-stale').hidden = !state.stale;
}

function renderAgents() {
  const list = $('agents');
  if (state.expanded && !agentByKey(state.expanded)) state.expanded = null;
  $('ag-cnt').textContent = state.agents.length ? '(' + state.agents.length + ')' : '';
  if (!state.agents.length) { list.innerHTML = '<div class="empty">nothing running</div>'; return; }
  list.innerHTML = state.agents.map(a => {
    const k = akey(a);
    const open = state.expanded === k;
    const c = colorOf(a);
    const att = attOf(a.task);
    return `<div class="agent" data-key="${esc(k)}">
      <div class="a-head">
        <span class="dot" style="background:${c}${open ? ';animation:pulse 1.2s infinite' : ''}"></span>
        <span class="m" style="color:${c}">${esc(short(a.pretty || a.model))}</span>
        <span class="role">${esc(a.role || a.purpose || '')}</span>
        <span class="task" title="${esc(a.task || '')}">${esc(baseOf(a.task))}</span>
        ${att ? `<span class="att">×${att}</span>` : ''}
        <span class="elp">${(a.elapsed_s || 0).toFixed(0)}s</span>
        <span class="chev">${open ? '▾' : '▸'}</span>
      </div>
      <div class="a-tx" hidden>
        <div class="tx-meta"></div>
        <pre class="tx-body"></pre>
      </div>
    </div>`;
  }).join('');
  list.querySelectorAll('.agent').forEach(el => {
    el.querySelector('.a-head').onclick = () => toggleAgent(el.dataset.key);
  });
  if (state.expanded) renderExpanded(state.expanded);
}

function toggleAgent(k) {
  state.expanded = state.expanded === k ? null : k;
  renderAgents();
  if (state.expanded) pollTranscript(state.expanded);
}

function fmtLines(lines) {
  return lines.map(l => {
    try {
      const o = JSON.parse(l);
      if (o.type === 'text') return (o.part && o.part.text) || '';
      if (o.type === 'step_finish') return '— step (' + ((o.part && o.part.tokens && o.part.tokens.total) || '?') + ' tok)';
      if (o.type === 'tool_use') return '🔧 ' + ((o.part && o.part.tool) || 'tool');
      return o.type;
    } catch (e) { return l.slice(0, 300); }
  }).join('\n');
}

function renderExpanded(k) {
  let row = null;
  document.querySelectorAll('#agents .agent').forEach(el => { if (el.dataset.key === k) row = el; });
  if (!row) return;
  const open = state.expanded === k;
  const tx = row.querySelector('.a-tx');
  tx.hidden = !open;
  row.querySelector('.chev').textContent = open ? '▾' : '▸';
  if (!open) return;
  const cached = state.tx[k];
  const meta = row.querySelector('.tx-meta');
  const body = row.querySelector('.tx-body');
  if (cached) {
    meta.textContent = cached.lines + ' lines';
    body.textContent = cached.text;
    body.scrollTop = state.txScroll[k] || 0;
  }
  body.onscroll = () => { state.txScroll[k] = body.scrollTop; };
}

async function pollTranscript(k) {
  const a = agentByKey(k);
  if (!a || !a.transcript) return;
  try {
    const d = await j('/api/transcript?file=' + encodeURIComponent(a.transcript) + '&tail=60');
    state.tx[k] = {text: fmtLines(d.lines || []), lines: d.total_lines};
    renderExpanded(k);
  } catch (e) {}
}

function renderTasks() {
  const list = $('tasks');
  const rows = allNodes().sort((a, b) => rank(a) - rank(b) || String(a.id).localeCompare(String(b.id))).slice(0, 80);
  $('task-cnt').textContent = rows.length ? '(' + rows.length + ')' : '';
  if (!rows.length) { list.innerHTML = '<div class="empty">no tasks yet</div>'; return; }
  list.innerHTML = rows.map(t => {
    const c = STATUSC[t.status] || STATUSC.pending;
    return `<div class="task" title="${esc(t.title)}">
      <span class="dot" style="background:${c}${(t.status === 'running' || t.live) ? ';animation:pulse 1.2s infinite' : ''}"></span>
      <span class="tname">${esc(t.id)}</span>
      ${t.model ? `<span class="tmodel" style="color:${COLORS[familyOf(t.model)] || 'var(--dim)'}">${esc(short(t.model))}</span>` : ''}
      <span class="tstate" style="color:${c}">${esc(t.status)}</span>
    </div>`;
  }).join('');
}

async function tryFleet() {
  state.fleetTried = true;
  try {
    const d = await j('/api/fleet');
    if (d && d.totals && d.totals.tokens != null) { state.fleet = d; renderStrip(); }
  } catch (e) {}
}

async function poll() {
  const before = window.scrollY;
  let ok = true, u = null, ag = null, pr = null;
  try { u = await j('/api/usage?range=1h'); } catch (e) { ok = false; }
  try { ag = await j('/api/agents'); } catch (e) { ok = false; }
  try { pr = await j('/api/projects'); } catch (e) { ok = false; }
  if (u) {
    state.tok1h = u.series ? (() => { let n = 0; for (const k in u.series) for (const p of u.series[k]) n += (p.tokens || 0); return n; })() : ((u.totals && u.totals.tokens) || 0);
  }
  if (ag) state.agents = ag.agents || [];
  if (pr) state.projects = pr.projects || [];
  state.stale = !ok;
  renderStrip();
  renderAgents();
  renderTasks();
  if (!state.fleetTried) tryFleet();
  window.scrollTo(0, before);
}

poll();
setInterval(poll, 5000);
setInterval(() => { if (state.expanded) pollTranscript(state.expanded); }, 3000);
</script>
</body>
</html>
