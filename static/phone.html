<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ARC · phone</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1117" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f6f8fa" media="(prefers-color-scheme: light)">
<style>
/* Palette tokens are the repo's canonical set (same as index.html). */
:root {
  --bg: #0d1117; --panel: #161b22; --border: #30363d; --text: #c9d1d9;
  --dim: #8b949e; --accent: #bc8cff; --ok: #3fb950; --warn: #d29922;
  --err: #f85149; --purple: #bc8cff; --grey: #484f58; --track: #21262d;
  color-scheme: dark light;
}
/* Respect the viewer's colour scheme: same tokens, light values. */
@media (prefers-color-scheme: light) {
  :root {
    --bg: #f6f8fa; --panel: #ffffff; --border: #d0d7de; --text: #1f2328;
    --dim: #57606a; --grey: #8c959f; --accent: #8250df; --ok: #1a7f37;
    --warn: #9a6700; --err: #cf222e; --purple: #8250df; --track: #eaeef2;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.45 ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  padding-bottom: calc(76px + env(safe-area-inset-bottom, 0px));
}
.top { display: flex; align-items: center; gap: 14px; padding: 10px 14px 0; max-width: 640px; margin: 0 auto; }
.top .brand { font-weight: 700; color: var(--accent); letter-spacing: .04em; }
.top a { color: var(--dim); text-decoration: none; font-size: 13px; }
.top a:hover { color: var(--accent); }
main { max-width: 640px; margin: 0 auto; padding: 8px 14px 8px; }
h1 { font-size: 22px; margin: 0; letter-spacing: -0.02em; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
h1 .stale { display: none; color: var(--warn); font-size: 13px; font-weight: 600; }
.pulse { display: inline-block; font-size: 13px; font-weight: 700; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--border); color: var(--dim); }
.pulse.live { color: var(--ok); border-color: var(--ok); }
.pulse.wait { color: var(--warn); border-color: var(--warn); }
.pulse.bad { color: var(--err); border-color: var(--err); }
.sub { color: var(--dim); font-size: 13px; margin: 4px 0 12px; }
.sec {
  font-size: 12px; color: var(--dim); text-transform: uppercase;
  letter-spacing: .08em; margin: 16px 0 8px; font-weight: 700;
}

/* Views: one visible at a time, switched by the bottom nav. */
.view { display: none; }
.view.on { display: block; }

/* Bottom navigation — the primary phone control. Every hit area is at
   least 44x44px (see .tap); buttons stretch to fill. */
.bnav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  display: flex; background: var(--panel); border-top: 1px solid var(--border);
  padding: 4px 0 calc(4px + env(safe-area-inset-bottom, 0px));
}
.bnav button {
  flex: 1 1 0; margin: 0 3px; border-radius: 12px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 2px; min-width: 44px; min-height: 48px;
  background: none; border: 0; color: var(--dim); font: inherit;
  font-size: 11px; text-transform: uppercase; letter-spacing: .04em; font-weight: 700;
  cursor: pointer; -webkit-tap-highlight-color: transparent; position: relative;
}
.bnav button .ic { font-size: 16px; line-height: 1; }
.bnav button.on { color: var(--accent); background: color-mix(in srgb, var(--accent) 16%, transparent); }
.nbadge { position: absolute; top: 2px; right: 6px; min-width: 16px; height: 16px; padding: 0 4px;
  border-radius: 8px; background: var(--err); color: #fff; font-size: 10px; line-height: 16px; font-weight: 700; }
.nbadge:empty { display: none; }

/* Canonical tap-target floor: anything tappable carries class="tap". */
.tap { min-width: 44px; min-height: 44px; }

/* Now view: figure cards, label above value, value carries the colour. */
.figs { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin: 0 0 12px; }
.fig { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px 10px; }
.fig .fl { display: block; font-size: 12px; color: var(--dim); text-transform: uppercase; letter-spacing: .05em; font-weight: 700; }
.fig .fv { font-size: 32px; font-weight: 700; line-height: 1.15; letter-spacing: -0.03em; }

/* Red-state banner. */
.alert {
  display: none; border: 1px solid var(--err); color: var(--err);
  background: color-mix(in srgb, var(--err) 12%, var(--panel)); border-radius: 14px; padding: 10px 14px;
  font-size: 14px; font-weight: 600; margin: 0 0 12px;
}
.alert div { overflow-wrap: anywhere; }

/* Cards: stacked full-width, one expanded at a time (progressive
   disclosure). The head is a real <button> so it is focusable and named. */
.stack { display: grid; gap: 8px; }
.card { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
.meter { height: 6px; background: var(--track); }
.meter i { display: block; height: 100%; background: var(--ok); }
.meter.hot i { background: var(--err); }
.meter.warn i { background: var(--warn); }
.card-head {
  display: flex; width: 100%; align-items: center; gap: 8px;
  padding: 9px 12px; min-width: 44px; min-height: 48px;
  background: none; border: 0; color: var(--text); font: inherit;
  text-align: left; cursor: pointer; -webkit-tap-highlight-color: transparent;
}
.card-head .cmain { flex: 1 1 auto; min-width: 0; display: grid; gap: 2px; }
.c-title { font-weight: 700; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.c-sub { font-size: 13px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chev { flex: 0 0 auto; color: var(--dim); font-size: 14px; transition: transform .15s ease; }
.card.open .chev { transform: rotate(90deg); }
.card-body { display: none; border-top: 1px solid var(--border); padding: 12px; font-size: 14px; }
.card.open .card-body { display: grid; gap: 6px; }
.kv { display: flex; gap: 8px; align-items: baseline; }
.kv .k { flex: 0 0 92px; color: var(--dim); }
.kv .v { flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; }
/* Live transcript tail inside an expanded agent card. */
.tx {
  margin: 0; padding: 6px 0 0; max-height: 160px; overflow: auto;
  white-space: pre-wrap; overflow-wrap: anywhere;
  font: 12px/1.4 inherit; color: var(--dim); max-height: 200px;
}

/* Bits inside cards. */
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
.chip {
  display: inline-block; border: 1px solid var(--border); border-radius: 999px;
  padding: 2px 8px; font-size: 12px; color: var(--dim); margin: 0 4px 4px 0;
}
.chip.hot { color: var(--err); border-color: var(--err); }
.pbar { height: 6px; border-radius: 3px; background: var(--grey); overflow: hidden; margin: 2px 0 4px; }
.pbar i { display: block; height: 100%; background: var(--ok); }
a { color: var(--accent); text-decoration: none; }
.empty {
  color: var(--dim); font-size: 12px; text-align: center;
  border: 1px dashed var(--border); border-radius: 12px; padding: 14px 8px;
}
/* Shared controls: select and action buttons (same as index.html). */
.fsel {
  background: var(--panel); color: var(--text); border: 1px solid var(--border);
  border-radius: 12px; padding: 8px 10px; font: inherit; font-size: 15px;
  width: 100%; min-height: 44px; max-width: none;
}
.fsel:hover { border-color: var(--accent); }
button.act {
  background: var(--panel); color: var(--text); border: 1px solid var(--border);
  border-radius: 6px; padding: 3px 10px; cursor: pointer; font: inherit;
  font-size: 12px; min-width: 44px; min-height: 44px;
}
button.act:hover { border-color: var(--accent); color: var(--accent); }
button.act.primary { border-color: var(--accent); color: var(--accent); }
button.act.danger { border-color: var(--err); color: var(--err); }

/* Plan chat: transcript bubbles and the live-mic state. */
.interim { color: var(--dim); font-size: 11px; min-height: 14px; }
.plan-tx {
  display: flex; flex-direction: column; gap: 8px;
  max-height: 220px; overflow-y: auto; overflow-wrap: anywhere;
  background: var(--panel); border: 1px solid var(--border);
  border-radius: 12px; padding: 8px; margin: 0 0 8px;
}
.composer { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
.composer input {
  width: 100%; min-height: 44px; border-radius: 12px; border: 1px solid var(--border);
  background: var(--panel); color: var(--text); font: inherit; font-size: 16px; padding: 8px 12px;
}
.composer-actions { display: flex; gap: 8px; }
.composer-actions .act { flex: 1; }
.plan-turn {
  max-width: 86%; padding: 8px 12px; border-radius: 14px;
  white-space: pre-wrap; overflow-wrap: anywhere;
  font-size: 15px; line-height: 1.4;
}
.plan-turn small { display: block; color: var(--dim); font-size: 12px; margin-bottom: 2px; }
.plan-turn.user { align-self: flex-end; background: var(--accent); color: #fff; }
.plan-turn.assistant { align-self: flex-start; background: var(--panel); border: 1px solid var(--border); }
.plan-turn.err { border: 1px solid var(--err); color: var(--err); background: var(--panel); }
@keyframes micpulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.15); } }
.mic-live { animation: micpulse 1s ease-in-out infinite; background: var(--accent); color: #0d1117; }

/* Needs you (review view) */
.rvimg { display: block; width: 100%; height: auto; border: 1px solid var(--border); border-radius: 6px; }
.rvwarn { color: var(--warn); font-size: 11px; }
.rvtext { width: 100%; box-sizing: border-box; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 6px; font: inherit; }
button.act.rvok { border-color: var(--ok); color: var(--ok); font-weight: 700; } button.act.rvno { border-color: var(--err); color: var(--err); }

/* Keyboard users must be able to see focus. */
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<header class="top">
  <span class="brand">ARC</span>
  <a href="/">Desktop</a>
  <a href="/usage.html">Usage</a>
</header>
<main>

<section id="view-now" class="view on" aria-label="Now">
  <h1>Now <span id="pulse" class="pulse">…</span> <span id="stale" class="stale">stale data</span></h1>
  <p class="sub" id="nowsub">loading…</p>
  <div class="figs" id="figs"></div>
  <div class="alert" id="alert" role="status"></div>
  <h2 class="sec">Agents</h2>
  <div class="stack" id="agents"></div>
</section>

<section id="view-review" class="view" aria-label="Needs you">
  <h1>Needs you</h1>
  <p class="sub" id="reviewsub">pull requests waiting for your decision</p>
  <div class="stack" id="reviews"></div>
</section>

<section id="view-projects" class="view" aria-label="Projects">
  <h1>Projects</h1>
  <p class="sub" id="projsub">tap a project to expand · one open at a time</p>
  <div class="stack" id="projects"></div>
</section>

<section id="view-prs" class="view" aria-label="Pull requests">
  <h1>Pull requests</h1>
  <p class="sub" id="prssub">github status unavailable</p>
  <div class="stack" id="prs"></div>
</section>

<section id="view-fleet" class="view" aria-label="Fleet">
  <h1>Fleet</h1>
  <p class="sub" id="fleetsub">queue status unavailable</p>
  <div class="stack" id="fleet"></div>
</section>

<section id="view-plan" class="view" aria-label="Plan">
  <h1>Plan</h1>
  <p class="sub" id="plan-sub">Select a repo to start planning</p>
  <select class="fsel" id="plan-repo" aria-label="Repository"></select>
  <div class="composer" style="margin-top:8px;">
    <select class="fsel" id="plan-sessions" aria-label="Chat session"></select>
    <button class="act" id="plan-new" type="button">New chat</button>
  </div>
  <div id="plan-transcript" class="empty">no chat yet</div>
  <div class="composer">
    <input type="text" id="plan-input" placeholder="Ask the planner" aria-label="Chat message" />
    <div class="composer-actions">
      <button class="act primary" id="plan-send" type="button">Send</button>
      <button class="act" id="plan-mic" type="button" style="display:none;" aria-label="Dictate">🎤</button>
    </div>
  </div>
  <div id="plan-interim" class="interim"></div>
  <div id="plan-taskcard"></div>
</section>

</main>

<nav class="bnav" aria-label="Primary">
  <button type="button" id="nav-now" class="tap on"><span class="ic" aria-hidden="true">◉</span>Now<span class="nbadge" id="badge-now"></span></button>
  <button type="button" id="nav-review" class="tap"><span class="ic" aria-hidden="true">✋</span>Review<span class="nbadge" id="badge-review"></span></button>
  <button type="button" id="nav-projects" class="tap"><span class="ic" aria-hidden="true">▦</span>Projects<span class="nbadge" id="badge-projects"></span></button>
  <button type="button" id="nav-prs" class="tap"><span class="ic" aria-hidden="true">⇄</span>PRs<span class="nbadge" id="badge-prs"></span></button>
  <button type="button" id="nav-fleet" class="tap"><span class="ic" aria-hidden="true">☰</span>Fleet<span class="nbadge" id="badge-fleet"></span></button>
  <button type="button" id="nav-plan" class="tap"><span class="ic" aria-hidden="true">✎</span>Plan</button>
</nav>

<script src="/common.js"></script>
<script>
"use strict";
// phone.html - small-screen monitoring surface for the ARC orchestrator.
// Reads only the five existing JSON endpoints; polling pauses while the
// tab is hidden; one card expanded per view; tappables are >= 44x44 px.

var POLL_MS = 5000;

// Transcript tail cache: req_id -> {text, total}, filled by pollTx().
var TX = {};

// Scroll offset of each open transcript pane, req_id -> px. The 5s poll
// rebuilds the agents stack wholesale; without saving and restoring
// scrollTop, every cycle throws a reader of a live tail back to the top.
var txScroll = {};

var S = {
  view: "now",
  agents: null,
  projects: null,
  gh: null,
  queue: null,
  summary: null,
  stale: false,
  open: { now: "", review: "", projects: "", prs: "", fleet: "" }
};

var VIEWIDS = ["now", "review", "projects", "prs", "fleet", "plan"];

function $(s) {
  return document.getElementById(s.startsWith("#") ? s.slice(1) : s);
}

function familyOf(x) {
  if (!x) return "";
  if (x.family) return x.family;
  var m = String(x.model || "").toLowerCase();
  if (m.indexOf("glm") >= 0) return "glm";
  if (m.indexOf("deepseek") >= 0) return "deepseek";
  // Historical only (both retired 2026-09-12): old rows and event-log entries
  // still carry these names and need a colour, not a routing option.
  if (m.indexOf("kimi") >= 0) return "kimi";
  if (m.indexOf("gpt-oss") >= 0) return "gpt-oss";
  return "";
}

function nowOf() {
  var n = S.gh && S.gh.now;
  return n ? n * 1000 : Date.now();
}

function ageSec(ts) {
  if (!ts) return 0;
  var ms = nowOf() - new Date(ts).getTime();
  return ms > 0 ? ms / 1000 : 0;
}

function allNodes() {
  var out = [];
  var ps = S.projects || [];
  for (var i = 0; i < ps.length; i++) {
    var ns = (ps[i].dag && ps[i].dag.nodes) || [];
    for (var j = 0; j < ns.length; j++) out.push(ns[j]);
  }
  return out;
}

function mergedToday() {
  if (S.gh && S.gh.ready) {
    var prs = S.gh.prs || [];
    var d = new Date();
    d.setHours(0, 0, 0, 0);
    var n = 0;
    for (var i = 0; i < prs.length; i++) {
      if (prs[i].mergedAt && new Date(prs[i].mergedAt).getTime() >= d.getTime()) n++;
    }
    return n;
  }
  var ns = allNodes();
  var m = 0;
  for (var k = 0; k < ns.length; k++) {
    if (ns[k].status === "merged") m++;
  }
  return m;
}

function failedCount() {
  var ns = allNodes();
  var n = 0;
  for (var i = 0; i < ns.length; i++) {
    var st = ns[i].status;
    if (st === "failed" || st === "conflict") n++;
  }
  return n;
}

function redLines() {
  var out = [];
  if (S.stale) out.push("data stale - refresh failing");
  // Every inflight agent is considered, task or no task: /api/agents reports
  // kimi-code sessions with "task": null (dashboard.py:417), and a stalled one
  // of those is exactly as stalled as any other. The task is only ever a label
  // here, so a missing one reads "?" rather than removing the agent.
  var ag = (S.agents && S.agents.agents) || [];
  for (var i = 0; i < ag.length; i++) {
    if (ag[i].stalled) out.push(short(ag[i].model) + " stalled on " + (ag[i].task || "?"));
  }
  if (S.gh && S.gh.ready) {
    var prs = S.gh.prs || [];
    for (var j = 0; j < prs.length; j++) {
      if (prs[j].stranded) out.push("PR #" + prs[j].number + " stranded");
    }
  }
  if (out.length > 6) out = out.slice(0, 6);
  return out;
}

function attr(s) {
  return esc(s).replace(/"/g, "&quot;");
}

function kv(k, v) {
  var val = v == null ? "-" : v;
  return '<div class="kv"><span class="k">' + esc(k) + '</span><span class="v">' + val + "</span></div>";
}

function fig(label, value, color) {
  return '<div class="fig"><span class="fl">' + esc(label) + '</span><span class="fv" style="color:' +
    (color || "") + '">' + value + "</span></div>";
}

function agentCard(a) {
  var fam = familyOf(a);
  var color = COLORS[fam] || "";
  var role = a.role || "";
  var task = a.task || "";
  var hb = a.last_event_s != null ? tick(a.last_event_s) + " ago" : "starting";
  var el = a.elapsed_s != null ? tick(a.elapsed_s) : "";
  var open = S.open.now === a.req_id;
  var body = "";
  if (open) {
    body = '<div class="card-body">' +
      kv("role", esc(role)) +
      kv("task", esc(task)) +
      kv("elapsed", el) +
      kv("heartbeat", hb) +
      kv("transcript", a.transcript ? esc(a.transcript) : "-") +
      (open && a.transcript ? txTail(a) : "") +
      "</div>";
  }
  return '<div class="card' + (open ? " open" : "") + '">' +
    '<button type="button" class="card-head tap" data-key="' + attr(a.req_id) +
    '" aria-expanded="' + open + '">' +
    '<span class="cmain"><span class="dot" style="background:' + (a.stalled ? "#f85149" : color) + '"></span>' +
    '<span class="c-title">' + esc(short(a.model)) + " · " + esc(role) + "</span>" +
    '<span class="c-sub">' + esc(task) + (a.stalled ? " · STALLED" : "") + "</span></span>" +
    '<span class="chev" aria-hidden="true">›</span></button>' + body + "</div>";
}

// Transcript lines arrive as JSONL harness records; render the readable bits.
function fmtTxLines(lines) {
  var out = [];
  for (var i = 0; i < lines.length; i++) {
    var l = lines[i];
    try {
      var o = JSON.parse(l);
      if (o.type === "text") out.push((o.part && o.part.text) || "");
      else if (o.type === "step_finish") out.push("- step (" + ((o.part && o.part.tokens && o.part.tokens.total) || "?") + " tok)");
      else if (o.type === "tool_use") out.push("tool: " + ((o.part && o.part.tool) || "tool"));
      else out.push(String(o.type));
    } catch (e) { out.push(String(l).slice(0, 300)); }
  }
  return out.join("\n");
}

function txTail(a) {
  var t = TX[a.req_id];
  return '<pre class="tx">' + esc(t ? t.text : "loading transcript...") + "</pre>";
}

// Run fn() (the agents-stack rebuild) without losing the open transcript
// pane's scroll position: capture before the innerHTML swap, restore after.
function keepTxScroll(fn) {
  var open = S.open.now;
  var box = $("#agents");
  var pre = open && box ? box.querySelector(".card.open .tx") : null;
  if (pre) txScroll[open] = pre.scrollTop;
  fn();
  var post = open && box ? box.querySelector(".card.open .tx") : null;
  if (post && txScroll[open]) post.scrollTop = txScroll[open];
}

// The dashboard serves transcripts only via /api/transcript - fetch the tail
// inline rather than linking the bare filename (which 404s).
async function pollTx(a) {
  var key = a.req_id;
  try {
    var d = await j("/api/transcript?file=" + encodeURIComponent(a.transcript) + "&tail=40");
    TX[key] = { text: fmtTxLines(d.lines || []), total: d.total_lines || 0 };
  } catch (e) {
    TX[key] = { text: "transcript unavailable", total: 0 };
  }
  if (S.open.now === key) renderNow();
}

function refreshTx() {
  var ag = (S.agents && S.agents.agents) || [];
  for (var i = 0; i < ag.length; i++) {
    if (ag[i].req_id === S.open.now && ag[i].transcript) pollTx(ag[i]);
  }
}

function projectCard(p) {
  var key = p.file;
  var open = S.open.projects === key;
  var done = (p.progress && p.progress.done) || 0;
  var total = (p.progress && p.progress.total) || 0;
  var pct = total > 0 ? Math.round((done / total) * 100) : 0;
  var act = p.last_activity ? tick(ageSec(p.last_activity)) + " ago" : "no activity";
  var head = '<button type="button" class="card-head tap" data-key="' + attr(key) + '" aria-expanded="' + open + '">' +
    '<span class="cmain"><span class="c-title">' + esc(p.title || p.file) + "</span>" +
    '<span class="c-sub">' + esc(p.file) + " · " + done + "/" + total +
    (p.active && p.run_pid ? " · running" : (p.active ? " · stale" : " · " + act)) + "</span></span>" +
    '<span class="chev" aria-hidden="true">›</span></button>';
  var body = "";
  if (open) {
    var st = p.statuses || {};
    var chips = Object.keys(st).map(function (k) {
      var hot = k === "failed" || k === "conflict";
      return '<span class="chip' + (hot ? " hot" : "") + '">' + esc(k) + " " + st[k] + "</span>";
    }).join("");
    var ns = (p.dag && p.dag.nodes) || [];
    var rows = "";
    for (var i = 0; i < ns.length; i++) {

async function j(url) {
  var res = await fetch(url, {cache: "no-store"});
  return res.json();
}

function authHeaders() {
  var t = null;
  try { t = localStorage.getItem("arc.dashboard.token"); } catch (e) {}
  return t ? {"Authorization": "Bearer " + t} : {};
}

async function jpost(u, body) {
  var send = function () {
    return fetch(u, {method: "POST", headers: Object.assign({"Content-Type": "application/json"}, authHeaders()), body: JSON.stringify(body)});
  };
  var r = await send();
  if (r.status === 401 && typeof prompt === "function") {
    var t = prompt("Dashboard token (ARC_DASHBOARD_TOKEN):");
    if (t && String(t).trim()) {
      try { localStorage.setItem("arc.dashboard.token", String(t).trim()); } catch (e) {}
      r = await send();
    }
  }
  return {code: r.status, body: await r.json()};
}

async function poll() {
  var res = await Promise.all([
    j("/api/summary").catch(function () { return null; }),
    j("/api/agents").catch(function () { return null; }),
    j("/api/projects").catch(function () { return null; }),
    j("/api/github").catch(function () { return null; }),
    j("/api/queue").catch(function () { return null; }),
    j("/api/reviews").catch(function () { return null; })
  ]);
  var bad = false;
  if (res[5]) S.reviews = res[5];
  if (res[0]) S.summary = res[0];
  if (res[1]) { S.agents = res[1]; } else { bad = true; }
  if (res[2]) { S.projects = res[2].projects || []; } else { bad = true; }
  if (res[3]) { S.gh = res[3]; } else { bad = true; S.gh = null; }
  if (res[4]) { S.queue = res[4]; } else { bad = true; }
  if (res[1] || res[2] || res[4]) S.syncedAt = Date.now();
  S.stale = bad;
  refreshTx();
  renderAll();
}

var timer = null;

function startTimers() {
  if (timer === null) timer = setInterval(poll, POLL_MS);
}

function stopTimers() {
  if (timer !== null) {
    clearInterval(timer);
    timer = null;
  }
}

document.addEventListener("visibilitychange", function () {
  if (document.hidden) {
    stopTimers();
  } else {
    startTimers();
    poll();
  }
});

      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      mic.style.display = "inline-block";
      const rec = new SR();
      rec.continuous = true;
      rec.interimResults = true;
      rec.lang = "en-US";
      let listening = false;
      mic.onclick = function(){
        if (listening) { rec.stop(); }
        else { rec.start(); }
      };
      rec.onresult = handleSpeechResult;
      rec.onstart = function(){ listening = true; setMicLive(true); };
      rec.onend = function(){ listening = false; setMicLive(false); };
      rec.onerror = function(){ listening = false; setMicLive(false); };
    } else {
      mic.style.display = "none";
    }
}

function handleSpeechResult(event){
  var input = $("#plan-input");
  if (!input) return;
  var interim = "";
  var final = "";
  for (var i = event.resultIndex; i < event.results.length; ++i) {
    var res = event.results[i];
    var transcript = res[0].transcript;
    if (res.isFinal) final += transcript;
    else interim += transcript;
  }
  if (final) {
    var v = input.value || "";
    input.value = v ? v.replace(/\s+$/, "") + " " + final : final;
  }
  var interimEl = $("#plan-interim");
  if (interimEl) interimEl.textContent = interim;
}

function setMicLive(live){
  var mic = $("#plan-mic");
  if (!mic) return;
  if (live){
    mic.classList.add("mic-live");
    mic.textContent = "🔴";
  } else {
    mic.classList.remove("mic-live");
    mic.textContent = "🎤";
    var interimEl = $("#plan-interim");
    if (interimEl) interimEl.textContent = "";
  }
}

    planRepoPath = sel.value;
    sel.onchange = onPlanRepoChange;
    // The repo picker chose the repo, so the repo-derived session is the one
    // to open — a session picked for the previous repo must not carry over.
    planSession = null;
    loadPlanHistory();
  }).catch(function () {});
}

function onPlanRepoChange() {
  const sel = $("#plan-repo");
  if (!sel) return;
  if (sel.value === "__new__") {
    const name = prompt("Repo kebab name:");
    if (!name) { loadPlanRepos(); return; }
    const slug = kebabSlug(name);
    if (!slug) { loadPlanRepos(); return; }
    jpost("/api/repos/create", { name: slug }).then(res => {
      if (res.code === 200) loadPlanRepos(res.body.path); else alert("Repo exists");
    }).catch(function () { alert("Repo exists"); });
    return;
  }
  planRepoPath = sel.value;
  stopPlanPoll();
  // A repo switch means a different default session; drop the picked one so
  // the new repo's own session is used.
  planSession = null;
  loadPlanHistory();
}

let planSession = null;
let planSessions = [];
let planTurns = [];
let planPollTimer = null;
let planRepoPath = "";

function kebabSlug(s) {
  return String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
}

function getPlanSession() {
  const repoPath = $("#plan-repo").value;
  if (!repoPath || repoPath === "__new__") return null;
  let slug = kebabSlug(repoPath.split("/").filter(Boolean).pop());
  if (!slug) return null;
  if (slug.length > 34) slug = slug.slice(0, 34).replace(/-+$/, "");
  return "plan-" + slug;
}

// A "New chat" id no live session holds yet: the repo's base id, then `-2`,
// `-3`, … — the whole id stays inside the backend's session-id rule.
function freshPlanSession(base, taken) {
  const used = taken || [];
  if (used.indexOf(base) === -1) return base;
  for (let i = 2; i < 1000; i++) {
    const id = base.slice(0, 39 - (String(i).length + 1)) + "-" + i;
    if (used.indexOf(id) === -1) return id;
  }
  return base;
}

// The active session name belongs in the panel subtitle, which is the only
// header the phone layout has room for.
function showPlanSession() {
  const sub = $("#plan-sub");
  if (!sub) return;
  if (planSession) sub.textContent = "session " + planSession;
  else sub.textContent = "Select a repo to start planning";
}

function setPlanSession(id) {
  planSession = id || null;
  const sel = $("#plan-sessions");
  if (sel && planSession) sel.value = planSession;
  showPlanSession();
}

async function loadPlanSessions() {
  let sessions = [];
  try {
    const data = await j("/api/chat/sessions");
    sessions = (data && data.sessions) || [];
  } catch (e) { sessions = []; }
  planSessions = sessions;
  // No session yet (first open of the panel) — adopt the repo's own, so the
  // header names it and the picker highlights it.
  if (!planSession) planSession = getPlanSession();
  const sel = $("#plan-sessions");
  if (!sel) return;
  const known = sessions.slice();
  if (planSession && !known.some(function (s) { return s.name === planSession; })) {
    known.unshift({ name: planSession, turns: planTurns.length, mtime: 0 });
  }
  sel.innerHTML = known.map(function (s) {
    return '<option value="' + attr(s.name) + '">' + esc(s.name) + " (" + s.turns + ")</option>";
  }).join("");
  sel.value = planSession || "";
  sel.onchange = onPlanSessionChange;
  showPlanSession();
}

function setPlanBusy(busy) {
  const send = $("#plan-send");
  if (send) send.disabled = busy;
  // The subtitle carries the ACTIVE SESSION now, so busy must not blank it:
  // saying "the planner is thinking…" is the job of the transcript spinner.
  showPlanSession();
  const sub = $("#plan-sub");
  if (sub && busy && planSession) sub.textContent = "session " + planSession + " — thinking…";
}

// A new chat is a NEW session id; switching is a different session on the same
// repo. Both rebuild the transcript from zero, because planTurns.length is the
// poll cursor into ONE session's turns.
async function newPlanSession() {
  const base = getPlanSession();
  if (!base) { alert("Select repo"); return; }
  stopPlanPoll();
  planTurns = [];
  planSession = freshPlanSession(base, planSessions.map(function (s) { return s.name; }));
  renderPlanTranscript();
  renderPlanTaskcard();
  setPlanBusy(false);
  await loadPlanSessions();
}

async function onPlanSessionChange() {
  const sel = $("#plan-sessions");
  if (!sel) return;
  const name = sel.value;
  if (!name || name === planSession) { showPlanSession(); return; }
  stopPlanPoll();
  setPlanSession(name);
  loadPlanHistory();
}

function startPlanPoll() {
  if (planPollTimer === null) planPollTimer = setInterval(pollPlan, 3000);
}

function stopPlanPoll() {
  if (planPollTimer !== null) {
    clearInterval(planPollTimer);
    planPollTimer = null;
  }
}

function sendPlanMessage() {
  const send = $("#plan-send");
  if (send && send.disabled) return;
  const input = $("#plan-input");
  const msg = input ? input.value.trim() : "";
  if (!msg) return;
  const repoEl = $("#plan-repo");
  const repo = repoEl ? repoEl.value : "";
  if (!repo || repo === "__new__") { alert("Select repo"); return; }
  // Send into the ACTIVE session — the operator may have picked one or made a
  // new chat. Only fall back to the repo-derived id when none is active.
  if (!planSession) planSession = getPlanSession();
  planTurns = [];
  if (input) input.value = "";
  setPlanBusy(true);
  jpost("/api/chat/start", { session: planSession, repo: repo, message: msg }).then(res => {
    if (res && res.code === 200) {
      startPlanPoll();
      pollPlan();
    } else if (res && res.code === 409) {
      setPlanBusy(true);
      startPlanPoll();
      pollPlan();
    } else {
      setPlanBusy(false);
      alert("Error starting chat");
    }
  }).catch(function () {
    setPlanBusy(false);
    alert("Error starting chat");
  });
}

async function pollPlan() {
  if (!planSession) planSession = getPlanSession();
  if (!planSession) { setPlanBusy(false); stopPlanPoll(); return; }
  const data = await j("/api/chat/poll?session=" + encodeURIComponent(planSession) + "&since=" + planTurns.length).catch(() => null);
  if (!data) { setPlanBusy(false); stopPlanPoll(); return; }
  const turns = data.turns || [];
  if (turns.length) planTurns = planTurns.concat(turns);
  renderPlanTranscript();
  renderPlanTaskcard();
  if (data.running) {
    setPlanBusy(true);
    startPlanPoll();
  } else {
    setPlanBusy(false);
    stopPlanPoll();
    loadPlanSessions();   // a finished turn may be the session's first
  }
}

function renderPlanTranscript() {
  const box = $("#plan-transcript");
  if (!box) return;
  if (!planTurns.length) {
    box.className = "empty";
    box.innerHTML = "no chat yet";
    return;
  }
  box.className = "plan-tx";
  box.innerHTML = planTurns.map(function (t) {
    const cls = t.error ? "err" : (t.role === "assistant" ? "assistant" : "user");
    let time = "";
    if (t.ts) { try { time = new Date(t.ts * 1000).toLocaleTimeString(); } catch (e) {} }
    return '<div class="plan-turn ' + cls + '">' +
      (time ? "<small>" + esc(time) + "</small>" : "") +
      "<div>" + esc(t.text || "") + "</div>" +
      (t.error ? "<div>" + esc(t.error) + "</div>" : "") + "</div>";
  }).join("");
}

function renderPlanTaskcard() {
  const card = $("#plan-taskcard");
  if (!card) return;
  let latest = null;
  for (let i = planTurns.length - 1; i >= 0; i--) {
    if (planTurns[i].role === "assistant" && planTurns[i].taskfile) { latest = planTurns[i]; break; }
  }
  if (!latest) { card.innerHTML = ""; return; }
  const file = latest.taskfile;
  card.innerHTML = '<div class="card"><div class="card-body" style="display:grid;">' +
    '<div>plan ready: ' + esc(file) + "</div>" +
    '<button class="act" data-run-file="' + attr(file) + '">▶ run</button>' +
    "</div></div>";
  wireRun("#plan-taskcard");
}

function loadPlanHistory() {
  // A picker choice wins over the repo-derived id; loadPlanSessions() keeps
  // the two in step, and the transcript always restarts from turn 0.
  if (!planSession) planSession = getPlanSession();
  if (!planSession) { renderPlanTranscript(); showPlanSession(); return; }
  planTurns = [];
  showPlanSession();
  j("/api/chat/poll?session=" + encodeURIComponent(planSession) + "&since=0").then(function (data) {
    planTurns = (data && data.turns) || [];
    renderPlanTranscript();
    renderPlanTaskcard();
    loadPlanSessions();
    if (data && data.running) {
      setPlanBusy(true);
      startPlanPoll();
    } else {
      setPlanBusy(false);
      stopPlanPoll();
    }
  }).catch(function () {});
}

function wireRun(sel) {
  const list = document.querySelectorAll(sel + " [data-run-file]");
  for (let i = 0; i < list.length; i++) {
    let btn = list[i];
    btn.onclick = function () {
      runProject(btn.getAttribute("data-run-file"));
    };
  }
}

function runProject(file) {
  if (confirm("Running this will spend model tokens and mutate branches. Continue?")) {
    jpost("/api/projects/run", { file: file }).then(r => {
      if (r && r.code === 200) alert(JSON.stringify(r.body));
      else alert("Project run failed");
    }).catch(function () { alert("Project run failed"); });
  }
}

init();
</script>
</body>
</html>
